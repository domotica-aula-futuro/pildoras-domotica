alias: Clima - encender ventilador
description: Enciende el ventilador si la temperatura supera el umbral durante 2 minutos
triggers:
  - trigger: numeric_state
    entity_id: sensor.vasco_clima_temperatura
    above: input_number.umbral_encendido
    for: "00:02:00"
conditions:
  - condition: time
    after: "08:00:00"
    before: "15:00:00"
    weekday: [mon, tue, wed, thu, fri]
actions:
  - action: switch.turn_on
    target:
      entity_id: switch.vasco_clima_ventilador
  - action: persistent_notification.create
    data:
      title: Clima del aula
      message: >-
        Ventilador encendido: {{ states('sensor.vasco_clima_temperatura') }} °C
mode: single
