alias: Clima - apagar ventilador
triggers:
  - trigger: numeric_state
    entity_id: sensor.vasco_clima_temperatura
    below: input_number.umbral_apagado
    for: "00:02:00"
  - trigger: time
    at: "15:05:00"                  # por seguridad, se apaga al acabar las clases
actions:
  - action: switch.turn_off
    target:
      entity_id: switch.vasco_clima_ventilador
mode: single
